<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esfera 3D Interativa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <div class="info">
        <p>🔮 Esfera 3D Interativa</p>
        <p>Passe o mouse sobre a esfera e depois saia para mudar de cor!</p>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Configuração da cena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x667eea);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(5, 5, 5);
        pointLight.castShadow = true;
        scene.add(pointLight);
        
        // Criar esfera
        const geometry = new THREE.SphereGeometry(1.5, 64, 64);
        const material = new THREE.MeshPhongMaterial({
            color: 0xff6b9d,
            shininess: 100
        });
        
        const sphere = new THREE.Mesh(geometry, material);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);
        
        // Raycaster para detectar mouse over
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let mouseOverSphere = false;
        
        // Função para gerar cor aleatória
        function getRandomColor() {
            const colors = [
                0xff6b9d, // Rosa
                0x00d2fc, // Ciano
                0xff006e, // Rosa escuro
                0xffd60a, // Amarelo
                0x06ffa5, // Verde néon
                0x3a86ff, // Azul
                0xfb5607, // Laranja
                0x8338ec, // Roxo
                0xffbe0b, // Amarelo ouro
                0x52b788  // Verde
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // Evento de movimento do mouse
        document.addEventListener('mousemove', (event) => {
            // Normalizar coordenadas do mouse
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Atualizar o raycaster
            raycaster.setFromCamera(mouse, camera);
            
            // Verificar intersecção com a esfera
            const intersects = raycaster.intersectObject(sphere);
            
            if (intersects.length > 0) {
                // Mouse está SOBRE a esfera
                if (!mouseOverSphere) {
                    mouseOverSphere = true;
                }
            } else {
                // Mouse SAIU da esfera - mudar cor
                if (mouseOverSphere) {
                    mouseOverSphere = false;
                    const newColor = getRandomColor();
                    sphere.material.color.setHex(newColor);
                }
            }
        });
        
        // Rotação contínua da esfera
        function animate() {
            requestAnimationFrame(animate);
            
            sphere.rotation.x += 0.001;
            sphere.rotation.y += 0.002;
            
            renderer.render(scene, camera);
        }
        
        // Tratar redimensionamento da janela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Iniciar animação
        animate();
    </script>
</body>
</html>
